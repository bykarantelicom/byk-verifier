# Independent daily verification of the BYK Data Layer BETA1 stream, run outside ByKaranteli's servers.
# Every day: a run from the committed checkpoint (only the sequences since the last run are read) with the rc6 13.7 cache
# proof: every data witness key before the checkpoint is asked for its newest transaction (one call each) and compared with
# the one the checkpoint recorded; nothing new under any of them makes the day's verdict FULL, otherwise it stays RESUMED.
# Every Sunday: a FULL run from sequence 0 (the rc6 13.7 verdict on the Solana evidence; needs an archive Solana endpoint,
# hours on a public one). Base is read in windows mode on both days: one short block range per expected copy, which the
# keyed free endpoint in BASE_RPC_URL completes (it allows ten blocks per eth_getLogs call); the Sunday run looks 24 hours
# beyond a window with no copy, so a copy the daily runs reported MISSING because it landed late is settled there.
# Results and the checkpoint are committed back to this repository, so the history of verdicts is public.
name: verify
on:
  schedule:
    - cron: "20 6 * * *"
    # Fallback slot (2026-10-19: the 06:20 run had not started by 07:34 UTC and the day's proof was dispatched by hand;
    # GitHub delays or drops scheduled runs under load). The same incremental run, skipped when the day's result exists.
    # Since 2026-10-20 the primary trigger is a workflow_dispatch from the ByKaranteli server (06:25 and 09:00 UTC daily,
    # Sunday 07:45 full); both slots fired seven hours late on 19 Oct and not at all by 10:40 UTC on 20 Oct.
    - cron: "50 8 * * *"
    - cron: "40 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental (from the committed checkpoint) or full (from sequence 0)"
        required: false
        default: "incremental"
permissions:
  contents: write
concurrency:
  group: verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      STREAM: 46b69e107bc75175e86a336662311c6e198bbf0dab271c06bc5248888238f66d
      SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned 2026-10-22
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned 2026-10-22
        with:
          node-version: "22"
      - name: Decide the mode
        id: mode
        env:
          # the dispatch input reaches the shell as an environment variable, never as interpolated script text (2026-10-22)
          MODE_INPUT: ${{ github.event.inputs.mode }}
        run: |
          MODE="$MODE_INPUT"
          case "$MODE" in ""|full|incremental) ;; *) echo "unknown mode: $MODE" >&2; exit 1 ;; esac
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 7 * * 0" ]; then MODE=full; else MODE=incremental; fi
          fi
          if [ "$MODE" != "full" ] && [ ! -f state/checkpoint.json ]; then MODE=full; fi
          DAY="$(date -u +%F)"
          SKIP=false
          # A scheduled slot has nothing to do once the day's result for its mode is committed (the server dispatches the
          # daily and the Sunday full run itself since 2026-10-20; GitHub's slots arrive hours late and act as the fallback).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$MODE" = "incremental" ] && { [ -f "results/$DAY.json" ] || [ -f "results/$DAY-full.json" ]; }; then SKIP=true; fi
            if [ "$MODE" = "full" ] && [ -f "results/$DAY-full.json" ]; then SKIP=true; fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          [ "$SKIP" = "true" ] && echo "the day's $MODE result is already committed: this scheduled slot has nothing to do" || true
      - name: Run the verifier
        id: run
        if: steps.mode.outputs.skip != 'true'
        continue-on-error: true
        run: |
          mkdir -p results state
          DAY="${{ steps.mode.outputs.day }}"
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            OUT="results/$DAY-full.json"
            node byk-verify.mjs --stream "$STREAM" --network mainnet --base-extension-hours 24 --checkpoint-out state/checkpoint.json --json > "$OUT" 2> "results/$DAY-full.err"
          else
            OUT="results/$DAY.json"
            node byk-verify.mjs --stream "$STREAM" --network mainnet --checkpoint state/checkpoint.json --checkpoint-out state/checkpoint.json --cache-proof --json > "$OUT" 2> "results/$DAY.err"
          fi
          RC=$?
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          exit $RC
      - name: Summarise
        if: steps.mode.outputs.skip != 'true'
        run: |
          node scripts/summarise-result.mjs "${{ steps.run.outputs.out }}" "${{ steps.run.outputs.rc }}" "${{ steps.mode.outputs.mode }}" >> results/README.md
          tail -3 results/README.md
      - name: Commit the result and the checkpoint
        if: steps.mode.outputs.skip != 'true'
        run: |
          git config user.name "byk-verifier"
          git config user.email "bykarantelicom@users.noreply.github.com"
          git add results state
          git commit -m "verify ${{ steps.mode.outputs.day }}: ${{ steps.mode.outputs.mode }} run, exit ${{ steps.run.outputs.rc }}" || echo "nothing to commit"
          # main may have moved during a long run (a workflow or README change pushed meanwhile): rebase, then push.
          git pull --rebase origin main
          git push
      - name: Fail the job when the verdict did not pass
        if: steps.mode.outputs.skip != 'true' && steps.run.outputs.rc != '0'
        run: exit 1
